<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Near Vision Training Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one reading column. Form sections stack as numbered sheets; the profile renders below as a clinical report; a slim progress bar sticks to the bottom. */
:root{
  --bg:#eef1f5; --surface:#ffffff; --ink:#15202e; --muted:#5a6676; --line:#d6dce5;
  --accent:#2e4ea6; --accent-soft:#e2e8f7; --sel-fg:#ffffff;
  --ok:#2c7a57; --warn:#a86a12; --crit:#b13e2a;
  --f-body:"IBM Plex Sans","IBM Plex Sans Hebrew",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-he:"IBM Plex Sans Hebrew","IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e131b; --surface:#161d28; --ink:#e5eaf1; --muted:#98a4b5; --line:#2a3443;
  --accent:#8ea7ec; --accent-soft:#1e2943; --sel-fg:#0e131b;
  --ok:#5cbd8f; --warn:#e0a54a; --crit:#e5765f; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e131b; --surface:#161d28; --ink:#e5eaf1; --muted:#98a4b5; --line:#2a3443;
  --accent:#8ea7ec; --accent-soft:#1e2943; --sel-fg:#0e131b;
  --ok:#5cbd8f; --warn:#e0a54a; --crit:#e5765f; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 88px}
html[lang="he"] body{font-family:var(--f-he)}
.wrap{max-width:780px;margin-inline:auto;display:flex;flex-direction:column;gap:18px;padding-block:24px 0}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
p{margin:0}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}

header.top{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;gap:14px;align-items:center;min-width:0}
#gabor{width:56px;height:56px;border-radius:50%;flex:none;border:1px solid var(--line)}
.brand h1{font-size:1.45rem;font-weight:700;letter-spacing:-.01em}
.brand p{color:var(--muted);font-size:.9rem;max-width:52ch}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.lang button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:.85rem;padding:6px 14px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--sel-fg)}

.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--accent-soft);border:1px dashed var(--accent);border-radius:10px;padding:10px 14px;font-size:.9rem}
.btn{font:inherit;font-size:.9rem;border:1px solid var(--accent);background:var(--accent);color:var(--sel-fg);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:focus-visible,.lang button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.sheet{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px}
.sheet-h{display:flex;gap:10px;align-items:baseline}
.sheet-h .tag{font-family:var(--f-mono);font-size:.75rem;color:var(--accent);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--accent);border-radius:4px;padding:1px 6px}
.sheet-h h2{font-size:1.1rem;font-weight:600}
.lead{color:var(--muted);font-size:.92rem}

.ids{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
.field input{font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.field input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.q{display:flex;flex-direction:column;gap:8px;padding-block:10px;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.q-text{display:flex;gap:10px;font-weight:500}
.q-text .qn{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);min-width:2.2em;padding-top:2px}
.scale{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.scale.dev{grid-template-columns:repeat(6,minmax(0,1fr))}
.scale input,.chips input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.scale label,.chips label{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;border:1px solid var(--line);border-radius:7px;padding:7px 4px;font-size:.78rem;line-height:1.2;cursor:pointer;background:var(--surface);color:var(--ink);min-height:44px;min-width:0;overflow-wrap:anywhere}
.scale label .v{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.scale label:hover,.chips label:hover{border-color:var(--accent)}
.scale input:checked+label,.chips input:checked+label{background:var(--accent);border-color:var(--accent);color:var(--sel-fg)}
.scale input:checked+label .v{color:var(--sel-fg)}
.scale input:focus-visible+label,.chips input:focus-visible+label{outline:2px solid var(--accent);outline-offset:2px}
.legend{font-size:.82rem;color:var(--muted)}
.chips{position:relative;display:flex;flex-wrap:wrap;gap:6px}
.chips label{flex-direction:row;padding:8px 12px;font-size:.85rem;min-height:40px}
.missing .q-text{color:var(--crit)}

/* report */
#results{scroll-margin-top:16px}
.report{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.r-head{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;padding:18px;border-bottom:1px solid var(--line)}
.score{display:flex;flex-direction:column;align-items:center;justify-content:center;width:112px;height:112px;border-radius:50%;border:6px solid var(--band,var(--accent));flex:none}
.score b{font-family:var(--f-mono);font-size:2.2rem;font-weight:500;line-height:1}
.score span{font-size:.72rem;color:var(--muted);font-family:var(--f-mono)}
.r-meta{display:flex;flex-direction:column;gap:6px;min-width:0}
.r-meta .who{font-size:.85rem;color:var(--muted)}
.pill{display:inline-block;align-self:flex-start;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:600;color:var(--sel-fg);background:var(--band,var(--accent))}
.r-meta .sum{font-size:1rem;font-weight:500}
.r-body{display:grid;grid-template-columns:1fr 1fr;gap:0}
.r-sec{padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0;border-bottom:1px solid var(--line)}
.r-sec+.r-sec{border-inline-start:1px solid var(--line)}
.r-sec.full{grid-column:1/-1;border-inline-start:0}
.r-sec h3{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.bar-row{display:grid;grid-template-columns:minmax(0,9em) 1fr 4.2em;gap:10px;align-items:center;font-size:.86rem}
.bar{position:relative;height:10px;border-radius:5px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.bar i{position:absolute;inset-block:0;inset-inline-start:0;background:var(--accent);border-radius:5px}
.bar .tick{position:absolute;inset-block:0;width:1px;background:var(--line)}
.bar-row .val{text-align:end;font-family:var(--f-mono);font-size:.82rem}
.bar-row.na{color:var(--muted)}
.bar-row.top i{background:var(--warn)}
.axis{display:grid;grid-template-columns:minmax(0,9em) 1fr 4.2em;gap:10px;font-family:var(--f-mono);font-size:.68rem;color:var(--muted)}
.axis div{display:flex;justify-content:space-between;direction:ltr}
html[dir="rtl"] .axis div{flex-direction:row-reverse}
table.plan{width:100%;border-collapse:collapse;font-size:.9rem}
table.plan th{text-align:start;font-weight:500;color:var(--muted);padding:8px 12px 8px 0;vertical-align:top;width:34%}
html[dir="rtl"] table.plan th{padding:8px 0 8px 12px}
table.plan td{padding:8px 0;vertical-align:top;font-weight:500}
table.plan tr+tr th,table.plan tr+tr td{border-top:1px solid var(--line)}
.flags{display:flex;flex-direction:column;gap:6px}
.flag{border-inline-start:3px solid var(--warn);padding-inline-start:10px;font-size:.88rem}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.status{font-size:.85rem;color:var(--ok)}
textarea#copybox{width:100%;min-height:90px;font-family:var(--f-mono);font-size:.78rem;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;direction:ltr}
details{font-size:.86rem;color:var(--muted)}
details summary{cursor:pointer;color:var(--accent)}
details ul{margin:8px 0 0;padding-inline-start:18px;display:flex;flex-direction:column;gap:4px}
.empty{padding:22px 18px;color:var(--muted)}
.note{font-size:.82rem;color:var(--muted)}

.dock{position:fixed;inset-inline:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.dock-in{max-width:780px;margin-inline:auto;display:flex;gap:12px;align-items:center}
.prog{flex:1;display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted);min-width:0}
.prog .bar{height:6px}

@media (max-width:620px){
  .r-body{grid-template-columns:1fr}
  .r-sec+.r-sec{border-inline-start:0}
  .r-head{grid-template-columns:1fr;justify-items:start}
  .scale label{font-size:.7rem;padding:6px 2px}
  .bar-row,.axis{grid-template-columns:minmax(0,7em) 1fr 3.6em}
}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .35s ease}}
/* v8: pick and rank situations, with other, birth date + age, distance Rx table */
.dob-row{display:flex;gap:8px;align-items:center}
.dob-row input{flex:1}
.age-out{font-family:var(--f-mono);font-size:.9rem;color:var(--ink);background:var(--accent-soft);border-radius:6px;padding:6px 10px;white-space:nowrap;min-width:5.5em;text-align:center}
.rx{width:100%;border-collapse:collapse;font-size:.9rem}
.rx th{font-weight:500;color:var(--muted);font-size:.8rem;padding:4px;text-align:center}
.rx th.eye{text-align:start;white-space:nowrap;padding-inline-end:10px;color:var(--ink);font-family:var(--f-mono)}
.eye-l{font-family:var(--f-body);color:var(--muted);font-weight:400}
.rx td{padding:4px}
.rx input{width:100%;min-width:0;font:inherit;font-family:var(--f-mono);font-size:.95rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 6px;text-align:center;direction:ltr}
.rx input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.sheet.missing{border-color:var(--crit)}
.rank-hint{font-weight:600;color:var(--accent)}
.sit-group{display:flex;flex-direction:column;gap:6px;padding-top:6px}
.sit-cat{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--accent)}
.sit-cat svg{width:26px;height:26px;flex:none}
.sit-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sit{font:inherit;font-size:.9rem;color:var(--ink);text-align:start;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;display:flex;align-items:flex-start;gap:10px;min-height:56px;min-width:0;position:relative}
.sit:hover{border-color:var(--accent)}
.sit:focus-visible,.sit-none:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sit-badge{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px dashed var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-weight:600}
.sit.on{background:var(--accent-soft);border-color:var(--accent)}
.sit.on .sit-badge{background:var(--accent);border:0;color:var(--sel-fg)}
.sit-text{flex:1;min-width:0}
.sit-first{position:absolute;top:-9px;inset-inline-end:8px;font-size:.68rem;background:var(--crit);color:#fff;border-radius:999px;padding:1px 8px}
.sit-other{display:flex;flex-direction:column;gap:8px}
.sit-other textarea{font:inherit;font-size:.9rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;resize:vertical;min-height:56px;width:100%}
.sit-other textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.sit-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.sit-none{font:inherit;font-size:.88rem;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;min-height:40px}
.sit-none.on{background:var(--ok);border-color:var(--ok);color:#fff}
.sit-res{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.tagc{display:inline-block;font-size:.72rem;border-radius:4px;padding:1px 6px;margin-inline-end:4px;border:1px solid var(--line);color:var(--muted)}
.podium{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.podium li{display:grid;grid-template-columns:2em 32px minmax(0,11em) 1fr 3.2em;gap:10px;align-items:center}
.podium .pos{font-family:var(--f-mono);font-weight:600;font-size:1.1rem;width:1.8em;height:1.8em;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--sel-fg)}
.podium .r1 .pos{background:var(--crit)}.podium .r2 .pos{background:var(--warn)}.podium .r3 .pos{background:var(--ok)}
.podium svg{width:30px;height:30px;color:var(--accent)}
.pname{display:flex;flex-direction:column;min-width:0}
.pname .en{font-size:.72rem;color:var(--muted);font-family:var(--f-mono)}
.pbar{position:relative;height:10px;border-radius:5px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.pbar i{position:absolute;inset-block:0;inset-inline-start:0;background:var(--accent);border-radius:5px}
.podium .r1 .pbar i{background:var(--crit)}.podium .r2 .pbar i{background:var(--warn)}.podium .r3 .pbar i{background:var(--ok)}
.pct{text-align:end;font-size:.85rem}
.add-big{display:flex;align-items:center;gap:10px;font-size:1.4rem}
.add-pill{font-size:.78rem}
.add-pill.l0{background:var(--ok)}.add-pill.l1{background:var(--warn)}.add-pill.l2{background:var(--crit)}.add-pill.lx{background:var(--muted)}
.gfocus{margin:0;padding-inline-start:18px;display:flex;flex-direction:column;gap:4px}
@media (max-width:620px){
  .sit-list{grid-template-columns:1fr}
  .rx input{padding:7px 2px;font-size:.82rem}
  .rx th.eye{padding-inline-end:4px}
  .eye-l{display:none}
  .rx td{padding:3px 2px}
  .podium li{grid-template-columns:2em 28px minmax(0,1fr) 3em;}
  .podium .pbar{display:none}
}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <canvas id="gabor" width="112" height="112" aria-hidden="true"></canvas>
      <div><h1 id="t-title"></h1><p id="t-sub"></p></div>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" id="lang-he" data-l="he">עברית</button>
      <button type="button" id="lang-en" data-l="en">English</button>
    </div>
  </header>

  <div class="banner" id="banner">
    <span id="t-example"></span>
    <button type="button" class="btn" id="btn-new"></button>
  </div>

  <form id="form" novalidate></form>

  <section id="results" aria-live="polite"></section>
</div>

<div class="dock">
  <div class="dock-in">
    <div class="prog"><span id="prog-text"></span><div class="bar"><i id="prog-bar"></i></div></div>
    <button type="button" class="btn" id="btn-view"></button>
  </div>
</div>

<script>
// v7: the participant picks everyday situations that are hard for them, in order from hardest to easiest.
// Situations belong to three categories; category weights come from the ranks of the chosen situations.
const CATS = ['V','L','C'];
const SIT = {V:['V1','V2','V3'], L:['L1','L2','L3'], C:['C1','C2','C3']};
const ALL = [].concat(SIT.V, SIT.L, SIT.C);
const catOf = s => s[0];
const OTHER = 'O';

 V:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M4 24s7-12 20-12 20 12 20 12-7 12-20 12S4 24 4 24z"/><circle cx="24" cy="24" r="6"/><path d="M33 33l9 9" stroke-width="2.5"/><circle cx="31" cy="31" r="1" fill="currentColor"/></svg>',

 O:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M30 8l10 10-20 20H10V28z"/><path d="M26 12l10 10"/><path d="M8 44h32" stroke-width="1.5"/></svg>',
 C:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><circle cx="24" cy="24" r="17"/><path d="M24 7a17 17 0 0 1 0 34z" fill="currentColor" opacity=".35" stroke="none"/><path d="M11 20h9M11 24h7M11 28h9" stroke-width="1.4"/><path d="M28 20h9M28 24h7M28 28h9" stroke-width="1.4" opacity=".4"/></svg>'
};

const T = {
 he:{
  title:'פרופיל אימון ראייה לקרוב',
  sub:'שאלון קצר לנבדקים בני 40+. הנבדק בוחר ומדרג מצבים מהיום־יום שקשה לו לראות בהם, והדירוג קובע את סדר העדיפויות באימון ה־Gabor.',
  example:'מוצגות תשובות לדוגמה של נבדק בדוי (EX-01). לחצו על "נבדק חדש" כדי להתחיל.',
  newP:'נבדק חדש', code:'קוד נבדק', dob:'תאריך לידה', date:'תאריך בדיקה', age:'גיל', ageOut:a=>`גיל ${a}`,
  rxH:'מרשם לרחוק ו־ADD', rxLead:'לפי הבדיקה האופטומטרית. אפשר להשאיר שדה ריק אם אין ערך.',
  eye:{od:'ימין',os:'שמאל'}, rxCol:{sph:'Sph',cyl:'Cyl',ax:'Axis',add:'ADD'},
  secA:'באילו מצבים קשה לך לראות?',
  rankLead:'לחצו על המצבים שקשה לך לראות בהם, לפי הסדר: קודם הקשה ביותר, אחר כך הבא אחריו, וכן הלאה. לא צריך לבחור את כולם, רק את מה שבאמת מקשה. לחיצה נוספת מבטלת בחירה.',
  hint:n=>n===0?'לחצו קודם על המצב הקשה ביותר':`נבחרו ${n} מצבים. אפשר להמשיך לבחור לפי סדר הקושי, או לסיים.`,
  noneHint:'סומן: אין לי קושי באף אחד מהמצבים.',
  first:'הכי קשה',
  reset:'בחירה מחדש', none:'אין לי קושי באף אחד מהמצבים',
  cat:{V:'חדות ראייה',L:'תאורה חלשה',C:'ניגודיות נמוכה',O:'אחר'},
  otherBtn:'מצב אחר שקשה לי בו', otherPh:'תארו במילים שלכם מצב נוסף שקשה לכם לראות בו (לא חובה)',
  sit:{
   V1:'קריאת אותיות קטנות על אריזות של תרופות ומזון',

const today = () => new Date().toISOString().slice(0,10);
const blankRx = () => ({od:{sph:'',cyl:'',ax:'',add:''}, os:{sph:'',cyl:'',ax:'',add:''}});
const EXAMPLE = {

  picks:['V1','L1','V2','C2','L2'], none:false, other:''

const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function ageOf(dob, on){
  if(!dob) return null;
  const b = new Date(dob+'T00:00:00'), d = new Date((on||today())+'T00:00:00');
  if(isNaN(b)||isNaN(d)) return null;
  let a = d.getFullYear()-b.getFullYear();
  const m = d.getMonth()-b.getMonth();
  if(m<0 || (m===0 && d.getDate()<b.getDate())) a--;
  return (a>=0 && a<130) ? a : null;
}
function fmtD(v){ if(v===''||v==null) return ''; const n = parseFloat(String(v).replace(',','.')); if(isNaN(n)) return String(v); return (n>0?'+':n<0?'−':'')+Math.abs(n).toFixed(2).replace(/^(\d)/,'$1'); }
function rxEye(e){
  const r = S.rx[e]; const parts = [];
  if(r.sph!=='') parts.push(fmtD(r.sph));
  if(r.cyl!=='' && parseFloat(r.cyl)!==0) parts.push(fmtD(r.cyl)+(r.ax!==''?' × '+r.ax+'°':''));
  return parts.join(' ');
}
function rxLine(){
  const od = rxEye('od'), os = rxEye('os');
  if(!od && !os) return '';
  return `OD ${od||'—'} · OS ${os||'—'}`;
}
function addLine(){
  const a = S.rx.od.add, b = S.rx.os.add;
  if(a==='' && b==='') return '';
  return `ADD OD ${fmtD(a)||'—'} · OS ${fmtD(b)||'—'}`;
}

function copyText(txt){
  const t = T[lang];
  const st = document.getElementById('copy-status');
  const box = document.getElementById('copybox');
  const fallback = ()=>{ box.hidden=false; box.value=txt; box.focus(); box.select(); st.textContent=t.copyFail; st.style.color='var(--warn)'; };
  try{
    navigator.clipboard.writeText(txt).then(()=>{ box.hidden=true; st.style.color=''; st.textContent=t.copied; setTimeout(()=>{st.textContent='';},2000); }, fallback);
  }catch(e){ fallback(); }
}

function renderChrome(){

function sitLabel(s, pre=true){ const t = T[lang]; return s===OTHER ? `${pre?t.cat.O+': ':''}${(S.other||'').trim()||t.otherBtn}` : t.sit[s]; }
function answered(){ return S.picks.length>0 || S.none; }
function renderProgress(){
  const n = S.none ? -1 : S.picks.length;
  document.getElementById('prog-text').textContent = T[lang].prog(n);
  document.getElementById('prog-bar').style.width = (S.none ? 100 : Math.min(100, S.picks.length/ALL.length*100))+'%';
}

function splitOf(w){
  // w: {V,L,C} weights summing to 1 (or all 0). At least 10% each, rounded to 5, total 100.
  const tot = CATS.reduce((a,k)=>a+w[k],0);
  if(tot===0) return {V:35,L:35,C:30};
  const raw = {}; CATS.forEach(k=>raw[k] = 10 + 70*w[k]/tot);
  const out = {}; CATS.forEach(k=>out[k] = Math.round(raw[k]/5)*5);
  let diff = 100 - CATS.reduce((a,k)=>a+out[k],0);
  const order = CATS.slice().sort((a,b)=>w[b]-w[a]);
  let i = 0;
  while(diff!==0 && i<20){ const k = order[i%3]; const step = diff>0?5:-5; if(out[k]+step>=10){ out[k]+=step; diff-=step; } i++; }
  return out;
}

function compute(){
  const t = T[lang];
  const n = S.picks.length;
  const pts = {V:0,L:0,C:0};
  S.picks.forEach((s,i)=>{ if(s!==OTHER) pts[catOf(s)] += n - i; });
  const tot = pts.V+pts.L+pts.C;
  const pct = {}; CATS.forEach(k=>pct[k] = tot ? Math.round(pts[k]/tot*100) : 0);
  const firstPos = k => { const i = S.picks.findIndex(s=>catOf(s)===k); return i<0 ? 99 : i; };
  const order = CATS.slice().sort((a,b)=> pts[b]-pts[a] || firstPos(a)-firstPos(b));
  const split = splitOf(pts);
  const adds = ['od','os'].map(e=>parseFloat(String(S.rx[e].add).replace(',','.'))).filter(x=>!isNaN(x));
  const addMax = adds.length ? Math.max(...adds) : null;
  const addLvl = addMax===null ? null : addMax>=2 ? 2 : addMax>=1.25 ? 1 : 0;
  const wk = addLvl===null ? 4 : [3,4,5][addLvl];
  const min = 15, weekly = min*wk;
  const age = ageOf(S.dob, S.date);
  const flags = [];
  if(age!==null && age<40) flags.push(t.flagAge);
  if(!rxLine()) flags.push(t.flagRx);
  if(addMax===null) flags.push(t.flagAdd);
  if(S.none) flags.push(t.flagNone);
  return {pts, pct, order, split, addMax, addLvl, wk, min, weekly, flags, age, none:S.none};
}

function renderResults(){
  const t = T[lang];

    el.innerHTML = `<div class="report"><div class="r-head" style="grid-template-columns:1fr"><h2>${t.rTitle}</h2></div><p class="empty">${t.incomplete}</p></div>`;

  }
  const r = compute();
  const who = [S.code||'—', r.age!==null?`${t.age} ${r.age}`:'', S.date].filter(Boolean).join(' · ');
  let h = `<div class="report">`;
  h += `<div class="r-head" style="grid-template-columns:1fr"><div class="r-meta"><span class="who"><span class="num">${esc(who)}</span></span><h2>${t.rTitle}</h2><p class="sum">${esc(t.summary(r))}</p></div></div>`;
  h += `<div class="r-body"><div class="r-sec full"><h3>${t.catH}</h3><ol class="podium">`;
  r.order.forEach((k,i)=>{
    h += `<li class="r${i+1}"><span class="pos">${i+1}</span>${ICON[k]}<span class="pname"><b>${esc(t.cat[k])}</b>${lang==='he'?`<bdi class="en" dir="ltr">${esc(T.en.cat[k])}</bdi>`:''}</span><span class="pbar"><i style="width:${r.pct[k]}%"></i></span><span class="pct num">${r.pct[k]}%</span></li>`;
  });
  h += `</ol></div>`;
  h += `<div class="r-sec full"><h3>${t.sitH}</h3>`;
  h += S.none ? `<p class="note">${esc(t.noneRes)}</p>` : `<ol class="sit-res">${S.picks.map(s=>`<li><span class="tagc c${catOf(s)}">${esc(t.cat[catOf(s)])}</span> ${esc(sitLabel(s,false))}</li>`).join('')}</ol>`;
  h += `</div>`;
  const rl = rxLine(), al = addLine();
  h += `<div class="r-sec"><h3>${t.addH}</h3><p class="add-big"><span class="num" dir="ltr">${r.addMax===null?'—':esc(fmtD(r.addMax))}</span> <span class="pill add-pill l${r.addLvl??'x'}">${r.addLvl===null?esc(t.addNone):esc(t.addLvl[r.addLvl])}</span></p></div>`;
  h += `<div class="r-sec"><h3>${t.rxRepH}</h3><p class="num" style="font-size:.86rem" dir="ltr">${esc(rl||t.rxNone)}${al?'<br>'+esc(al):''}</p></div>`;
  h += `<div class="r-sec full"><h3>${t.planH}</h3><table class="plan"><tbody>
    <tr><th>${t.rows.order}</th><td>${r.order.map(k=>esc(t.cat[k])).join(lang==='he'?' ← ':' → ')}</td></tr>
    <tr><th>${t.rows.split}</th><td>${r.order.map(k=>`${esc(t.cat[k])} ${r.split[k]}%`).join(' · ')}</td></tr>
    <tr><th>${t.rows.gabor}</th><td><ol class="gfocus">${r.order.map(k=>`<li><b>${esc(t.cat[k])}:</b> ${esc(t.gabor[k])}</li>`).join('')}</ol></td></tr>
    <tr><th>${t.rows.freq}</th><td>${esc(t.freq(r.wk))}</td></tr>
    <tr><th>${t.rows.session}</th><td>${esc(t.sess(r.min))}</td></tr>
    <tr><th>${t.rows.weekly}</th><td>${esc(t.weeklyFmt(r.weekly))}</td></tr>
    <tr><th>${t.rows.corr}</th><td>${esc(t.corrTrain)}${rl?'<br><span class="num" dir="ltr">'+esc(rl)+'</span>':''}</td></tr>
  </tbody></table></div>`;
  if(r.flags.length) h += `<div class="r-sec full"><h3>${t.flagH}</h3><div class="flags">${r.flags.map(f=>`<p class="flag">${esc(f)}</p>`).join('')}</div></div>`;
  h += `<div class="r-sec full"><div class="actions"><button type="button" class="btn" id="copy-sum">${t.copySum}</button><button type="button" class="btn ghost" id="copy-csv">${t.copyCsv}</button><span class="status" id="copy-status" role="status"></span></div>
    <textarea id="copybox" readonly hidden aria-label="Copy text"></textarea>
    <details><summary>${t.method}</summary><ul>${t.methodItems.map(m=>`<li>${esc(m)}</li>`).join('')}</ul></details>
    <p class="note">${t.note}</p></div>`;
  h += `</div></div>`;
  el.innerHTML = h;
  document.getElementById('copy-sum').onclick = ()=>copyText(summaryText(r));
  document.getElementById('copy-csv').onclick = ()=>copyText(csvText(r));
}

function summaryText(r){
  const t = T[lang];
  const lines = [
    `${t.rTitle}: ${S.code||'—'} · ${t.dob} ${S.dob||'—'} (${t.age} ${r.age??'—'}) · ${S.date}`,
    `${t.rxRepH}: ${rxLine()||t.rxNone}${addLine()?' · '+addLine():''}`,
    `${t.catH}: ${r.order.map(k=>`${t.cat[k]} ${r.pct[k]}%`).join(' · ')}`,
    `${t.sitH}: ${S.none?t.noneRes:S.picks.map((s,i)=>`${i+1}. ${sitLabel(s)}`).join(' | ')}`,
    `${t.rows.split}: ${r.order.map(k=>`${t.cat[k]} ${r.split[k]}%`).join(' · ')}`,
    `${t.rows.gabor}: ${r.order.map(k=>`${t.cat[k]}: ${t.gabor[k]}`).join(' | ')}`,
    `${t.rows.freq}: ${t.freq(r.wk)} · ${t.rows.session}: ${t.sess(r.min)} · ${t.rows.weekly}: ${t.weeklyFmt(r.weekly)}`,
    `${t.rows.corr}: ${t.corrTrain}`
  ];
  r.flags.forEach(f=>lines.push('• '+f));
  return lines.join('\n');
}
function csvText(r){
  const KEY = {V:'visual_clarity',L:'low_light',C:'low_contrast'};
  const head = ['code','dob','age','date','od_sph','od_cyl','od_axis','od_add','os_sph','os_cyl','os_axis','os_add',
    ...ALL.map(s=>'rank_'+s), 'weight_visual_clarity','weight_low_light','weight_low_contrast','order',
    'split_visual_clarity','split_low_light','split_low_contrast','rank_other','other_text','no_difficulty','add_max','sessions_week','session_min','weekly_min'];
  const rx = ['od','os'].flatMap(e=>['sph','cyl','ax','add'].map(k=>S.rx[e][k]));
  const vals = [S.code,S.dob,r.age??'',S.date,...rx, ...ALL.map(s=>{ const i=S.picks.indexOf(s); return i<0?'':i+1; }),
    r.pct.V,r.pct.L,r.pct.C, r.order.map(k=>KEY[k]).join('>'), r.split.V,r.split.L,r.split.C, (S.picks.indexOf(OTHER)+1)||'', (S.other||'').trim(), S.none?1:0, r.addMax??'', r.wk, r.min, r.weekly];
  const q = v => { v = String(v??''); return /[",\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v; };
  return head.join(',') + '\n' + vals.map(q).join(',');
}

function rankChanged(){
  document.getElementById('rank-box').innerHTML = renderRank();
  if(answered()){ const q = document.getElementById('q-rank'); if(q) q.classList.remove('missing'); }
  renderProgress(); renderResults();
}
document.getElementById('form').addEventListener('click', e=>{
  const b = e.target.closest('.sit');
  if(b){
    const s = b.dataset.sit, pos = S.picks.indexOf(s);
    if(pos<0){ S.picks.push(s); S.none = false; } else S.picks.splice(pos,1);
    rankChanged();
    const again = (s===OTHER && pos<0 && !(S.other||'').trim()) ? document.getElementById('other-text') : document.querySelector(`.sit[data-sit="${s}"]`); if(again) again.focus();
    return;
  }
  if(e.target.closest('#sit-none')){ S.none = !S.none; if(S.none) S.picks = []; rankChanged(); const x=document.getElementById('sit-none'); if(x) x.focus(); return; }
  if(e.target.closest('#rank-reset')){ S.picks = []; S.none = false; rankChanged(); }
});
document.getElementById('form').addEventListener('input', e=>{
  const f = e.target.dataset.f, rx = e.target.dataset.rx;
  if(e.target.dataset.other){
    S.other = e.target.value;
    const has = S.other.trim()!=='', on = S.picks.includes(OTHER);
    if(has!==on){
      if(has){ S.picks.push(OTHER); S.none = false; } else S.picks.splice(S.picks.indexOf(OTHER),1);
      const caret = e.target.selectionStart;
      rankChanged();
      const ta = document.getElementById('other-text'); if(ta){ ta.focus(); ta.setSelectionRange(caret,caret); }
    } else renderResults();
    return;
  }
  if(f){ S[f] = e.target.value; if(f==='dob'||f==='date') updateAge(); renderResults(); }
  else if(rx){ const [eye,k] = rx.split('.'); S.rx[eye][k] = e.target.value.trim(); renderResults(); }
});
document.getElementById('form').addEventListener('submit', e=>e.preventDefault());
document.getElementById('btn-new').addEventListener('click', ()=>{
  S = blank(); isExample = false; showMissing = false; renderAll();
  window.scrollTo({top:0});
  document.getElementById('f-code').focus();
});
document.getElementById('btn-view').addEventListener('click', ()=>{
  if(!answered()){
    showMissing = true; renderForm();
    const first = document.getElementById('q-rank');
    if(first){ first.scrollIntoView({block:'center'}); return; }
  }
  document.getElementById('results').scrollIntoView({block:'start'});
});
document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click', ()=>{
  lang = b.dataset.l;
  try{ localStorage.setItem('nvtp-lang', lang); }catch(e){}
  renderAll(); drawGabor();
}));

function drawGabor(){
  const c = document.getElementById('gabor'), x = c.getContext('2d');
  const cs = getComputedStyle(document.documentElement);
  const hex = s => { s=s.trim().replace('#',''); return [0,2,4].map(i=>parseInt(s.slice(i,i+2),16)); };
  let bg, fg;
  try{ bg = hex(cs.getPropertyValue('--surface')); fg = hex(cs.getPropertyValue('--ink')); }catch(e){ bg=[255,255,255]; fg=[21,32,46]; }
  const W = c.width, img = x.createImageData(W,W), sig = W/6, f = 4.5/W, th = Math.PI/4;
  for(let j=0;j<W;j++) for(let i=0;i<W;i++){
    const dx=i-W/2, dy=j-W/2;
    const xr = dx*Math.cos(th)+dy*Math.sin(th);
    const g = Math.exp(-(dx*dx+dy*dy)/(2*sig*sig)) * Math.cos(2*Math.PI*f*xr);
    const m = 0.5 + 0.45*g, p = (j*W+i)*4;
    for(let k=0;k<3;k++) img.data[p+k] = Math.round(bg[k] + (fg[k]-bg[k])*m);
    img.data[p+3]=255;
  }
  x.putImageData(img,0,0);
}
try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change', drawGabor); }catch(e){}
new MutationObserver(drawGabor).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

renderAll(); drawGabor();
</script>
